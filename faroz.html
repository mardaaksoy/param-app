<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Faroz Yalı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Düzen: tam ekran izometrik kıyı köyü; üstte tek bar (menü · sepet · ün · nüfus · para), altta tek hedef kartı,
   diyaloglar alttan açılan kart. Tek görsel dünya: tema değişmez, renkler açıkça verilir. */
:root {
  --kagit: #f3f1ea;        /* kart zemini: soluk ağ beyazı */
  --lacivert: #24425e;     /* Karadeniz grisi-laciverti */
  --lacivert-koyu: #172d42;
  --cay: #4f7a34;          /* çay yaprağı yeşili */
  --findik: #8a5a32;       /* fındık kabuğu */
  --tekne: #c8352b;        /* tekne kırmızısı */
  --murekkep: #1b2633;
  --golge: rgba(18, 32, 46, .24);
  --altin: #f0b43a;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: #4d7438; color: var(--murekkep);
  font-family: var(--body); -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: none;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.topbar {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 6px; pointer-events: none;
}
.pill {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 5px;
  height: 40px; padding: 0 11px; border-radius: 20px; border: 0;
  background: var(--kagit); box-shadow: 0 3px 0 var(--golge);
  font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1;
  font-variant-numeric: tabular-nums; color: var(--murekkep); white-space: nowrap;
}
button.pill { cursor: pointer; }
.pill svg { width: 20px; height: 20px; flex: none; }
.iconbtn { width: 40px; padding: 0; justify-content: center; }
.pill:focus-visible, .goal:focus-visible, .btn:focus-visible { outline: 3px solid var(--altin); outline-offset: 2px; }
.spacer { flex: 1; }
.money { background: var(--lacivert); color: #fff; padding-right: 13px; }
.money.bump { animation: bump .25s ease-out; }
@keyframes bump { 50% { transform: scale(1.08); } }
/* sepet: sayı yok, doluluk çubuğu */
.basket { padding: 0 10px; }
.basket .fill { width: 26px; height: 8px; border-radius: 4px; background: #dcdcd2; overflow: hidden; }
.basket .fill i { display: block; height: 100%; width: 0; background: var(--findik); border-radius: 4px; }
.basket.full { background: #ffd9cf; }
.basket.full .fill i { background: var(--tekne); }
.rep { color: #8a5d00; }
.pop { color: var(--cay); }

.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; pointer-events: none;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: center;
}
.goal {
  pointer-events: auto; width: 100%; max-width: 440px; box-sizing: border-box;
  background: var(--kagit); border-radius: 18px; padding: 10px 14px 12px;
  box-shadow: 0 4px 0 var(--golge); display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center;
}
.goal.cta { background: #fff1c4; cursor: pointer; }
.goal.flash { animation: flash .6s ease-out; }
@keyframes flash { 0% { background: #fff1c4; transform: translateY(-4px); } 100% { background: var(--kagit); transform: none; } }
.goal .step {
  grid-row: span 2; width: 44px; height: 44px; border-radius: 12px; background: var(--lacivert);
  color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1;
}
.goal .chap { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--cay); font-weight: 800; }
.goal .text { font-weight: 800; font-size: 16px; line-height: 1.25; min-width: 0; }
.goal .req { grid-column: 1 / -1; font-size: 13px; font-weight: 800; color: var(--tekne); margin-top: 2px; }
.bar { grid-column: 1 / -1; height: 10px; border-radius: 6px; background: #dcdcd2; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--cay), #86ad4a); border-radius: 6px; transition: width .25s; }

.sheet-wrap {
  position: fixed; inset: 0; z-index: 20; background: rgba(12, 24, 36, .35);
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet {
  width: 100%; max-width: 440px; box-sizing: border-box; background: var(--kagit);
  border-radius: 22px; padding: 16px 16px 18px; box-shadow: 0 6px 0 var(--golge);
  animation: up .22s ease-out; max-height: 80vh; overflow-y: auto; touch-action: pan-y;
}
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet, .goal.flash, .money.bump { animation: none; } .bar i { transition: none; } }
.sheet h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.1; text-wrap: balance; }
.sheet p { margin: 0; font-size: 16px; line-height: 1.45; }
.dlg { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start; cursor: pointer; }
.dlg > div { min-width: 0; }
.portrait { width: 64px; height: 64px; border-radius: 16px; display: block; }
.who { font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1.1; }
.who small { display: block; font-family: var(--body); font-size: 12px; font-weight: 700; color: var(--cay); letter-spacing: .04em; text-transform: uppercase; }
.dlg p { margin-top: 6px; }
.dlg.letter { grid-template-columns: 1fr; background: #f6f2e4; border: 2px dashed #c9bd98; border-radius: 14px; padding: 14px; }
.dlg.letter p { font-style: italic; }
.hint { margin-top: 12px; text-align: right; font-size: 13px; font-weight: 800; color: var(--lacivert); }
.menu-list { display: grid; gap: 10px; margin-top: 12px; }
.btn {
  border: 0; cursor: pointer; border-radius: 14px; font-family: var(--display); font-weight: 800; font-size: 17px;
  padding: 10px 16px; background: var(--lacivert); color: #fff; box-shadow: 0 4px 0 var(--lacivert-koyu);
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--lacivert-koyu); }
.btn.red { background: var(--tekne); box-shadow: 0 4px 0 #87221b; }
.btn.light { background: #dfe4e2; color: var(--murekkep); box-shadow: 0 4px 0 #b9c0bd; }
.note { font-size: 13px; color: #56634e; margin-top: 10px; line-height: 1.4; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--tekne); margin-bottom: 4px; }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin-top: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stats b { text-align: right; }
textarea { width: 100%; box-sizing: border-box; min-height: 90px; margin-top: 10px; border-radius: 12px; border: 2px solid #c9c6bb; padding: 8px; font: 12px/1.3 ui-monospace, monospace; background: #fff; color: var(--murekkep); -webkit-user-select: text; user-select: text; }
.toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 62px); transform: translateX(-50%);
  z-index: 6; background: var(--murekkep); color: #fff; font-weight: 800; font-size: 14px;
  padding: 8px 14px; border-radius: 12px; pointer-events: none; opacity: 0; transition: opacity .2s;
  max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: .92; }
@media (max-width: 430px) {
  .pill { font-size: 16px; height: 36px; padding: 0 9px; gap: 4px; }
  .pill svg { width: 17px; height: 17px; }
  .iconbtn { width: 36px; padding: 0; }
  .topbar { gap: 5px; }
}
</style>
</head>

/* bölümün satış listesi: tezgâhta müşterinin isteyebileceği ürünler */

/* bir büyüme kapısının hâlâ istediği elle yapılmış mal */

function obstacles() {
  const o = [L.stall, L.yali, L.kufe];
  for (const id in FAC) if (FAC[id].ch <= S.chapter) o.push(FAC[id].r);
  if (S.chapter >= 2) o.push(L.houses.ev1, L.houses.ev2, L.ocak);
  if (S.chapter >= 3) o.push(L.paket, L.rampa);
  if (S.chapter >= 4) o.push(L.ahir, L.yev);
  return o;
}
const onIskele = (x, y) => x > L.iskele.x + 0.08 && x < L.iskele.x + L.iskele.w - 0.08 && y > L.iskele.y0 + 0.2 && y < 0.7;
const inShoal = (x, y) => x > L.shoal.x + .05 && x < L.shoal.x + L.shoal.w - .05 && y > L.shoal.y + .05;
function blocked(x, y) {
  if (x < 0.25 || x > mapW() - 0.25 || y > mapH() - 0.25) return true;
  if (y < 0.35 && !onIskele(x, y) && !inShoal(x, y)) return true;
  for (const r of obstacles()) if (x > r.x - 0.25 && x < r.x + r.w + 0.25 && y > r.y - 0.25 && y < r.y + r.h + 0.25) return true;
  return false;
}
function unstick() {
  if (!blocked(S.px, S.py)) return;
  for (let r = 0.1; r < 4; r += 0.1) for (let i = 0; i < 24; i++) {
    const a = i / 24 * Math.PI * 2, nx = S.px + Math.cos(a) * r, ny = S.py + Math.sin(a) * r;
    if (!blocked(nx, ny)) { S.px = nx; S.py = ny; return; }
  }
  S.px = L.start[0]; S.py = L.start[1];
}
function movePlayer(dx, dy, dt) {
  const len = Math.hypot(dx, dy);
  T.moving = len > 0.01;
  if (!T.moving) return;
  const sp = CFG.speed * Math.min(1, len) * dt;
  const nx = S.px + dx / len * sp, ny = S.py + dy / len * sp;
  if (!blocked(nx, S.py)) S.px = nx;
  if (!blocked(S.px, ny)) S.py = ny;
  T.walk += dt * 10;
  const sx = dx - dy; if (Math.abs(sx) > 0.05) T.face = sx > 0 ? 1 : -1;
}

/* ================================================================
   GİRİŞ: ekranda bas-sürükle sanal kol + WASD / oklar

const joy = { on: false, ox: 0, oy: 0, x: 0, y: 0, id: null };
const keys = {};
const cv = $("game");
cv.addEventListener("pointerdown", e => {

  joy.on = true; joy.id = e.pointerId; joy.ox = joy.x = e.clientX; joy.oy = joy.y = e.clientY;

cv.addEventListener("pointermove", e => { if (joy.on && e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; } });
const endJoy = e => { if (e.pointerId === joy.id) { joy.on = false; joy.id = null; } };
cv.addEventListener("pointerup", endJoy); cv.addEventListener("pointercancel", endJoy);
const typing = e => e.target && e.target.tagName === "TEXTAREA";
addEventListener("keydown", e => { if (!typing(e)) keys[e.key.toLowerCase()] = true; });
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; joy.on = false; });
function inputVector() {
  let sx = 0, sy = 0;
  if (joy.on) {
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy);
    if (d > 6) { const m = Math.min(1, d / 50); sx = dx / d * m; sy = dy / d * m; }
  }
  if (keys["arrowleft"] || keys["a"]) sx -= 1;
  if (keys["arrowright"] || keys["d"]) sx += 1;
  if (keys["arrowup"] || keys["w"]) sy -= 1;
  if (keys["arrowdown"] || keys["s"]) sy += 1;
  const wx = sx / TW * 2 + sy / TH, wy = sy / TH - sx / TW * 2;
  const l = Math.hypot(wx, wy), m = Math.min(1, Math.hypot(sx, sy));
  return l > 0 ? [wx / l * m, wy / l * m] : [0, 0];
}

const CUST_LOOKS = [

  { body: "#5d6e3a", cap: "#6a4a2a" }, { body: "#2f5f7a", hair: "#2a1d14" }, { body: "#8c6a3a", scarf: "#c8352b" },
];
const spawnX = () => mapW() + 1.5;

  const ks = shelfKinds();
  const stocked = ks.filter(k => shelfN(k) > 0);

/* müşteri sıklığı nüfus ve ünle artar */
const custEvery = () => Math.max(1.4, 4.2 * Math.pow(CFG.pop.start / S.pop, 0.75) * (1.15 - S.rep / 160));
const maxQueue = () => 4 + S.chapter;
function spawnCustomer() {

    look: Object.assign({ skin: ["#e6b58b", "#d39a6c", "#c98d62", "#ecc29c"][Math.floor(Math.random() * 4)] }, look), walk: 0, face: -1, sad: false });
}
function moveTo(o, tx, ty, sp, dt) {
  const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy);
  if (d < 0.02) { o.x = tx; o.y = ty; o.moving = false; return true; }
  const s = Math.min(d, sp * dt);
  o.x += dx / d * s; o.y += dy / d * s; o.moving = true; o.walk = (o.walk || 0) + dt * 10;
  if (Math.abs(dx - dy) > 0.01) o.face = dx - dy > 0 ? 1 : -1;
  return false;
}
function stepCustomers(dt) {
  if (S.step >= 1 || S.chapter > 1 || S.st.dropped > 0) {
    T.spawnT -= dt;
    const inLine = T.customers.filter(c => c.state !== "out").length;
    if (T.spawnT <= 0 && inLine < maxQueue()) { spawnCustomer(); T.spawnT = custEvery() * (0.7 + Math.random() * 0.6); }
  }
  const line = T.customers.filter(c => c.state !== "out");
  line.forEach((c, i) => {
    const [qx, qy] = L.queue(i);
    if (c.state === "in") {
      if (Math.abs(c.x - qx) > 0.05) moveTo(c, qx, L.roadY, 2.4, dt);
      else if (moveTo(c, qx, qy, 2.4, dt)) c.state = "wait";
    } else {
      moveTo(c, qx, qy, 2.4, dt);
      c.wait += dt;
      if (i === 0 && shelfN(c.k) === 0 && c.got === 0 && c.wait > 6 && !c.swapped) {
        const alt = shelfKinds().filter(k => shelfN(k) > 0);
        if (alt.length) { c.k = alt[Math.floor(Math.random() * alt.length)]; c.swapped = true; }
      }
      if (c.wait > CFG.patience) leave(c, true);
    }
  });
  const front = line[0];
  const server = S.unl.nazmiye || near(L.sat, 0.75);
  if (front && front.state === "wait" && server && shelfN(front.k) > 0) {
    T.serveT += dt;
    if (T.serveT >= CFG.serveTime) {
      T.serveT = 0;
      const h = S.shelfH[front.k] > 0;
      if (h) S.shelfH[front.k]--; else S.shelf[front.k]--;
      front.got++;

      const p = price(front.k, h);
      if (S.unl.nazmiye) earn(p); else { S.cash += p; T.rev[T.rev.length - 1] += p; }
      S.st.soldN++; S.st.sold[front.k] = (S.st.sold[front.k] || 0) + 1;
      floatText(front.x, front.y, "+" + p + " ₺" + (h ? " ★" : ""), "#ffe28a");
      if (front.got >= front.n) { leave(front, false); addRep(0.8); }
    }
  } else T.serveT = 0;
  for (const c of T.customers) if (c.state === "out") {
    if (Math.abs(c.y - L.roadY) > 0.05) moveTo(c, c.x, L.roadY, 2.6, dt);
    else moveTo(c, spawnX() + 1, L.roadY, 2.6, dt);
  }
  T.customers = T.customers.filter(c => !(c.state === "out" && c.x > spawnX() + 0.9));

/* ================================================================
   ÇALIŞANLAR: her biri adlı, tek ve sabit işli. Oyuncu bir şey atamaz.
   ================================================================ */
function putFac(w, id) {
  const f = FAC[id], st = S.fac[id];
  for (let i = w.carry.length - 1; i >= 0; i--) if (base(w.carry[i]) === f.inK && st.inp < CFG.facCap) { w.carry.splice(i, 1); st.inp++; }
}
function takeFac(w, id) { const f = FAC[id], st = S.fac[id]; while (w.carry.length < wcap() && st.out > 0) { st.out--; w.carry.push(f.outK); } }
function toShelf(w) {
  for (let i = w.carry.length - 1; i >= 0; i--) { const k = w.carry[i]; if (shelfN(k) < CFG.shelfCap) { w.carry.splice(i, 1); S.shelf[k]++; } }
}
const wcap = () => CFG.worker.cap[S.chapter];
const facTime = id => FAC[id].time / (id === "tutsu" && S.unl.tutsu2 ? CFG.tutsu2 : 1) / (id === "tuz" && S.chapter >= 3 ? CFG.tuz2 : 1);
const carriedKoli = (w, k) => w.carry.filter(x => base(x) === k).length;
/* rota: sırayla gezilen noktalar; act içeren noktada iş yapılır. 0. nokta ev; iş yoksa orada bekler. */
const ROUTES = {
  fadime: { ready: () => S.pile > 0 && S.fac.ayik.inp < CFG.facCap, pts: [
    { p: L.pile, act: w => { while (w.carry.length < wcap() && S.pile > 0) { S.pile--; w.carry.push("hamsi"); } } },
    { p: [9.0, 3.7] }, { p: FAC.ayik.inAt, act: w => putFac(w, "ayik") }, { p: [9.0, 3.7] } ] },
  hamdi: { ready: () => S.fac.ayik.out > 0 && S.fac.tuz.inp < CFG.facCap, pts: [
    { p: FAC.ayik.outAt, act: w => takeFac(w, "ayik") }, { p: [8.3, 4.3] }, { p: [8.3, 7.4] },
    { p: FAC.tuz.inAt, act: w => putFac(w, "tuz") }, { p: [8.3, 7.4] }, { p: [8.3, 4.3] } ] },
  idris: { ready: () => S.fac.tuz.out > 0 || (S.fac.tutsu.out > 0 && !S.unl.market), pts: [
    { p: FAC.tuz.outAt, act: w => { if (S.fac.tutsu.inp < CFG.facCap) takeFac(w, "tuz"); } },
    { p: [8.15, 8.1] }, { p: [8.15, 10.8] }, { p: FAC.tutsu.inAt, act: w => putFac(w, "tutsu") },
    { p: FAC.tutsu.outAt, act: w => { if (!S.unl.market) takeFac(w, "tutsu"); } },
    { p: [8.5, 8.85] }, { p: L.sat, act: toShelf }, { p: [8.5, 8.85] } ] },
  kazim: { ready: () => S.fac.fabrika.out > 0 && !S.unl.market, pts: [
    { p: FAC.fabrika.outAt, act: w => { if (!S.unl.market) takeFac(w, "fabrika"); } }, { p: [16.3, 9.3] }, { p: [13.2, 9.35] },
    { p: L.sat, act: toShelf }, { p: [13.2, 9.35] }, { p: [16.3, 9.3] } ] },
  cafer: { ready: () => !!S.ct && KOLIS.some(k => (S.paket.out[k] || 0) > 0 && ctNeed(k) > 0), pts: [
    { p: L.paketOut, act: w => { for (const k of KOLIS) while (w.carry.length < wcap() && (S.paket.out[k] || 0) > 0 && ctNeed(k) - carriedKoli(w, k) > 0) { S.paket.out[k]--; w.carry.push(k); } } },
    { p: [16.0, 16.9] }, { p: L.rampaAt, act: w => { for (let i = w.carry.length - 1; i >= 0; i--) if (loadKoli(w.carry[i])) w.carry.splice(i, 1); } }, { p: [16.0, 16.9] } ] },
};
/* toplayıcılar: olgun ürünü toplar, tesisin girişine koyar */
const HARVESTERS = {
  zehra: { kind: "yascay", fac: "fabrika", home: [16.0, 3.3] },
  husnu: { kind: "findik", fac: "kavurma", home: [1.0, 16.6] },
  murat: { kind: "sut", fac: "mandira", home: [0.9, 23.8] },
  dursun: { kind: "petek", fac: "suzme", home: [13.0, 22.6] },
};
function worker(id) {
  if (!T.workers[id]) {
    const home = ROUTES[id] ? ROUTES[id].pts[0].p : HARVESTERS[id] ? HARVESTERS[id].home : L.nazmiyeAt;
    T.workers[id] = { id, x: home[0], y: home[1], carry: [], i: 0, pause: 0, walk: 0, face: 1, moving: false };
  }
  return T.workers[id];
}
function stepWorkers(dt) {
  for (const id of Object.keys(ROUTES)) {
    if (!S.unl[id]) continue;
    const w = worker(id), R = ROUTES[id];
    if (w.pause > 0) { w.pause -= dt; w.moving = false; continue; }
    const pt = R.pts[w.i];
    if (moveTo(w, pt.p[0], pt.p[1], CFG.worker.speed, dt)) {
      if (w.i === 0 && !w.carry.length && !R.ready()) { w.moving = false; continue; }
      if (pt.act) { pt.act(w); w.pause = 0.35; }
      w.i = (w.i + 1) % R.pts.length;
    }
  }
  for (const id of Object.keys(HARVESTERS)) {
    if (!S.unl[id]) continue;
    const Hv = HARVESTERS[id], w = worker(id), f = FAC[Hv.fac];
    if (w.pause > 0) { w.pause -= dt; w.moving = false; continue; }
    const facOpen = !!S.unl[Hv.fac];
    const room = facOpen && S.fac[Hv.fac].inp + w.carry.length < CFG.facCap;
    if (w.carry.length >= wcap() || (w.carry.length && (!room || !nearestRipe(Hv.kind, w.x, w.y)))) {
      if (!facOpen) { moveTo(w, Hv.home[0], Hv.home[1], CFG.worker.speed, dt); continue; }
      if (moveTo(w, f.inAt[0], f.inAt[1], CFG.worker.speed, dt)) { putFac(w, Hv.fac); w.pause = .35; }
      continue;
    }
    const c = room ? nearestRipe(Hv.kind, w.x, w.y) : null;
    if (!c) { moveTo(w, Hv.home[0], Hv.home[1], CFG.worker.speed, dt); continue; }
    if (moveTo(w, c.x, c.y + (c.tree ? .45 : 0), CFG.worker.speed * 0.9, dt)) { pickCrop(c, w.carry); w.pause = .25; }
  }
  if (S.unl.nazmiye) { const w = worker("nazmiye"); w.x = L.nazmiyeAt[0]; w.y = L.nazmiyeAt[1]; w.face = 1; }
  if (S.unl.temel) {
    const b = T.boat;
    b.t += dt;
    if (b.phase === "dock" && b.t > 1.6 && S.pile < CFG.pileCap) { b.phase = "sea"; b.t = 0; }
    else if (b.phase === "sea" && b.t >= CFG.boatTrip) {
      b.phase = "dock"; b.t = 0;
      const n = Math.min(CFG.boatCatch * (S.unl.tekne2 ? CFG.boat2 : 1), CFG.pileCap - S.pile); S.pile += n;
      if (n > 0) floatText(L.pile[0], L.pile[1], "+" + n + " hamsi", "#d6ecff");
    }
  }
}

/* ================================================================
   TESİSLER: el bölmesi önce işlenir (mühürlü), sonra işçinin koyduğu
   ================================================================ */
function stepFacilities(dt) {
  for (const id in FAC) {
    if (!S.unl[id]) continue;
    const f = FAC[id], st = S.fac[id];
    const mode = st.hand >= f.ratio && st.outH < CFG.facCap ? "h" : st.inp >= f.ratio && st.out < CFG.facCap ? "n" : null;
    if (!mode) { st.t = 0; continue; }
    st.t += dt;
    if (st.t >= facTime(id)) {
      st.t = 0;

/* pakethane: kamyonun istediği malı bant tesislerden çeker, 5'ini bir koli yapar. El bölmesinden mühürlü koli çıkar. */
const SRC = { tutsu: "tutsu", kurucay: "fabrika", kavrulmus: "kavurma", peynir: "mandira", bal: "suzme" };
function stepPaket(dt) {
  const pk = S.paket;
  T.beltT -= dt;
  if (S.ct && T.beltT <= 0) {
    T.beltT = 0.25;
    for (const k of KOLIS) {
      const u = unitOf(k);
      const need = ctNeed(k) - (pk.out[k] || 0) - Math.floor((pk.q[u] || 0) / CFG.koli.per) - (T.workers.cafer ? carriedKoli(T.workers.cafer, k) : 0) - carryN(k);
      if (need <= 0 || (pk.q[u] || 0) >= 10) continue;
      const fs = S.fac[SRC[u]];
      if (S.unl[SRC[u]] && fs.out > 0) { fs.out--; pk.q[u] = (pk.q[u] || 0) + 1; }
    }
  }
  const handK = Object.keys(pk.h).find(u => pk.h[u] >= CFG.koli.per);
  const normK = Object.keys(pk.q).find(u => pk.q[u] >= CFG.koli.per);
  const mode = handK ? ["h", handK] : normK ? ["n", normK] : null;
  if (!mode) { pk.t = 0; return; }
  pk.t += dt;
  if (pk.t >= 1.6) {
    pk.t = 0; const [m, u] = mode, k = koliOf(u);
    if (m === "h") { pk.h[u] -= CFG.koli.per; pk.outH[k] = (pk.outH[k] || 0) + 1; }
    else { pk.q[u] -= CFG.koli.per; pk.out[k] = (pk.out[k] || 0) + 1; }
  }
}
/* market: raflar tesislerin çıkışından kendiliğinden dolar (kamyonun ihtiyacı önce) */
function stepMarket(dt) {
  T.mktT -= dt; if (T.mktT > 0) return; T.mktT = 0.3;
  for (const u of Object.keys(SRC)) {
    const fs = S.fac[SRC[u]]; if (!S.unl[SRC[u]] || fs.out <= 0 || shelfN(u) >= CFG.shelfCap) continue;
    if (S.ct && ctNeed(koliOf(u)) > 0 && fs.out < 8) continue;
    fs.out--; S.shelf[u]++;
  }
}

const BUYERS = ["Trabzon Gıda", "Rize Toptan", "Samsun Hal", "Giresun Kooperatifi", "Ordu Market Zinciri"];

  const req = {};

}

let AC = null, muted = false;
try { muted = localStorage.getItem("faroz.mute") === "1"; } catch (e) {}

const SFX = { pick: [[880, 1320, .06, "sine", .05]], drop: [[540, 420, .05, "triangle", .05]], coin: [[1250, 1650, .06, "square", .018]], sell: [[700, 900, .05, "sine", .04]],
  unlock: [[523, 523, .09, "triangle", .07], [659, 659, .09, "triangle", .07], [784, 784, .09, "triangle", .07], [1047, 1047, .18, "triangle", .07]] };

/* ================================================================
   GÜNCELLEME
   ================================================================ */
function update(dt) {
  if (T.toastT > 0 && (T.toastT -= dt) <= 0) $("toast").classList.remove("show");
  if (T.dialog || !$("sheetWrap").hidden) return;
  T.time += dt;
  T.revT += dt; if (T.revT >= 5) { T.revT -= 5; T.rev.shift(); T.rev.push(0); }
  for (const f of T.floats) f.t += dt;
  T.floats = T.floats.filter(f => f.t < 1.4);

  unstick();
  const [mx, my] = inputVector();
  movePlayer(mx, my, dt);
  const cap = capNow();

  stepFx(dt);
  // hasat: tarladan ve ağacın altından geçerken
  T.pickT -= dt;
  for (const c of S.crops) {
    if (S.carry.length >= cap) break;
    if (!ripe(c)) continue;
    const d = dist(S.px, S.py, c.x, c.y);
    if (c.tree ? d < 1.1 && T.pickT <= 0 : d < 0.6) { pickCrop(c, S.carry); if (c.tree) T.pickT = 0.18; picked(c); }
  }

  T.xferT -= dt;
  if (T.xferT <= 0) {
    if (S.unl.temel && near(L.pile) && S.pile > 0 && S.carry.length < cap) { S.pile--; S.carry.push("hamsi"); T.xferT = 0.09; flyIn("hamsi", L.pile); }
    for (const id in FAC) {
      if (!S.unl[id]) continue;
      const f = FAC[id], st = S.fac[id];
      // girdi: oyuncunun koyduğu önce el bölmesine (mühürlü çıkar)
      if (near(f.inAt)) {
        const i = lastIdx(S.carry, x => base(x) === f.inK);
        if (i >= 0 && (st.hand < CFG.handCap || st.inp < CFG.facCap)) { flyOut(S.carry[i], [f.r.x + f.r.w / 2, f.r.y + f.r.h / 2, 20]); S.carry.splice(i, 1); if (st.hand < CFG.handCap) st.hand++; else st.inp++; T.xferT = 0.08; }
      }
      if (near(f.outAt) && st.out + st.outH > 0 && S.carry.length < cap) {
        if (st.outH > 0) { st.outH--; S.carry.push(f.outK + "*"); } else { st.out--; S.carry.push(f.outK); }
        S.st.made[f.outK] = (S.st.made[f.outK] || 0) + 1; T.xferT = 0.08; flyIn(S.carry[S.carry.length - 1], f.outAt);
      }
    }
    if (S.unl.paket) {
      const pk = S.paket;
      if (near(L.paketIn)) {
        const i = lastIdx(S.carry, x => SRC[base(x)]);
        if (i >= 0) { const u = base(S.carry[i]); if ((pk.h[u] || 0) < 10) { flyOut(S.carry[i], [L.paket.x + 1, L.paket.y + .7, 20]); S.carry.splice(i, 1); pk.h[u] = (pk.h[u] || 0) + 1; T.xferT = 0.08; } }
      }
      if (near(L.paketOut) && S.carry.length < cap) {
        const kh = KOLIS.find(k => (pk.outH[k] || 0) > 0), kn = KOLIS.find(k => (pk.out[k] || 0) > 0 && (!S.ct || ctNeed(k) > carryN(k)));
        if (kh) { pk.outH[kh]--; S.carry.push(kh + "*"); T.xferT = 0.1; flyIn(kh + "*", L.paketOut); }
        else if (kn) { pk.out[kn]--; S.carry.push(kn); T.xferT = 0.1; flyIn(kn, L.paketOut); }
      }
    }
    if (S.unl.rampa && near(L.rampaAt) && S.ct) {
      const need = goodsNeed();
      const i = lastIdx(S.carry, x => KOLIS.includes(base(x)) && ctNeed(base(x)) > 0 && !(isH(x) && need[x] > 0));
      if (i >= 0) { const it = S.carry[i]; if (loadKoli(it)) { flyOut(it, [L.truck[0] - .3, L.truck[1], 30]); S.carry.splice(i, 1); T.xferT = 0.12; } }
    }
    // SAT: sepetteki satılık malı rafa diz (kapının istediği mühürlü mal hariç)
    if (near(L.sat, 0.75)) {
      const need = goodsNeed();
      for (let i = S.carry.length - 1; i >= 0; i--) {
        const it = S.carry[i], k = base(it);
        if (!PRODUCTS.includes(k) || (isH(it) && need[it] > 0)) continue;
        if (shelfN(k) < CFG.shelfCap) { flyOut(it, [L.stall.x + 1.5, L.stall.y + .4, 30]); S.carry.splice(i, 1); if (isH(it)) S.shelfH[k]++; else S.shelf[k]++; S.st.dropped++; T.xferT = 0.07; break; }
      }
    }
  }
  if (!S.unl.nazmiye && near(L.cash) && S.cash > 0) {
    T.cashT -= dt;
    if (T.cashT <= 0) { const n = Math.min(S.cash, Math.max(1, Math.ceil(S.cash / 12))); S.cash -= n; S.money += n; S.st.earned += n; S.st.collected += n; T.cashT = 0.05; flyIn("para", L.cash); sfx("coin"); }
  }
  if (S.carry.length >= cap && T.moving && !T.fullWarn) { T.fullWarn = true; toast("Sepet doldu. Tezgâha ya da bir tesise götür."); }
  if (S.carry.length < cap) T.fullWarn = false;

  // ödeme alanı: üstünde dur, para akarak dolar; kapı elle yapılmış mal da istiyorsa sepetten alır
  const st = STEP();
  if (!S.done && st.zone && !S.unl[st.zone]) {
    const zid = st.zone, cost = CFG.zoneCost[zid];

        if (amt > 0) { T.payAcc -= amt; S.money -= amt; S.paid[zid] = (S.paid[zid] || 0) + amt; T.coinT -= dt; if (T.coinT <= 0) { T.coinT = .07; flyOut("para", [...L.zones[zid], 2]); sfx("coin"); } }
      }

      if (T.goodsT <= 0) {
        for (const k of Object.keys(goodsNeed())) if (takeFromCarry(k)) { flyOut(k, [...L.zones[zid], 2]); const pg = S.pg[zid] || (S.pg[zid] = {}); pg[k] = (pg[k] || 0) + 1; T.goodsT = 0.15; break; }
      }

  }

  stepCrops(dt);
  stepFacilities(dt);
  stepWorkers(dt);
  stepCustomers(dt);
  stepTrade(dt);
  for (const k of sellables()) T.empty[k] = shelfN(k) === 0 ? (T.empty[k] || 0) + dt : 0;
  checkStep();
  T.saveT += dt; if (T.saveT > 3) { T.saveT = 0; save(); }
}

/* ================================================================

   ================================================================ */
const RAW_HOME = { yascay: [18.3, 2.4], findik: [4, 16.5], sut: [3.5, 25.2], petek: [15, 24.2] };
function fishTarget() { const c = nearestRipe("hamsi", S.px, S.py); return c ? [c.x, c.y] : L.fishSpot; }
function obtainTarget(k, depth = 0) {
  if (depth > 5) return null;

  if (RAW_HOME[k]) { const c = nearestRipe(k, S.px, S.py); return c ? [c.x, c.y] : RAW_HOME[k]; }
  const id = FAC_OF[k], f = FAC[id], st = S.fac[id];
  if (!S.unl[id]) return null;
  if (st.out + st.outH > 0) return f.outAt;
  if (carryN(f.inK) >= f.ratio || (carryN(f.inK) > 0 && st.inp + st.hand + carryN(f.inK) >= f.ratio)) return f.inAt;
  if (st.inp + st.hand >= f.ratio) return f.outAt;
  return obtainTarget(f.inK, depth + 1);
}
/* mühürlü mal: girdiyi el bölmesine koy, çıkıştan al */
function muhurTarget(item) {
  const k = base(item);
  if (S.carry.length >= capNow()) return fullTarget();   // önce sepeti boşalt (mühürlü mal tezgâha bırakılmaz)
  if (KOLIS.includes(k)) {
    const u = unitOf(k), pk = S.paket;
    if ((pk.outH[k] || 0) > 0) return L.paketOut;
    if ((pk.h[u] || 0) >= CFG.koli.per) return L.paketOut;
    if (carryN(u) > 0 && carryN(u) + (pk.h[u] || 0) >= CFG.koli.per) return L.paketIn;
    if (S.carry.length >= capNow()) return fullTarget();
    return obtainTarget(u);
  }
  const id = FAC_OF[k], f = FAC[id], st = S.fac[id];
  if (st.outH > 0) return f.outAt;
  if (carryN(f.inK) > 0 && st.hand < CFG.handCap) return f.inAt;
  if (st.hand >= f.ratio) return f.outAt;
  if (S.carry.length >= capNow()) return fullTarget();
  return obtainTarget(f.inK);
}
/* sepet doluysa: içindeki ham malı işleyecek açık bir tesis varsa oraya, yoksa tezgâha */
function fullTarget() {
  for (const id in FAC) if (S.unl[id] && carryN(FAC[id].inK) > 0 && S.fac[id].hand + S.fac[id].inp < CFG.handCap + CFG.facCap - 2) return FAC[id].inAt;
  return L.sat;
}
function sellTarget(k) {
  if (S.carry.length >= capNow()) return fullTarget();

function earnTarget() {

  }
  if (S.chapter >= 4) {
    if (S.unl.suzme && !S.unl.dursun) return sellTarget("bal");
    if (S.unl.kovan && !S.unl.suzme) return sellTarget("petek");
    if (S.unl.mandira && !S.unl.murat) return sellTarget("peynir");
    if (S.unl.ahir && !S.unl.mandira) return sellTarget("sut");
    if (S.unl.murat) return sellTarget("peynir");
  }

function targetPoint() {
  if (S.done) return null;
  const st = STEP();
  if (st.zone && !S.unl[st.zone]) {
    const need = goodsNeed(), nk = Object.keys(need);
    const missing = nk.find(k => carryExact(k) < need[k]);
    const cost = CFG.zoneCost[st.zone], paid = S.paid[st.zone] || 0;
    if (missing && paid + S.money >= cost * 0.5) return muhurTarget(missing);
    if (S.money >= cost - paid || (nk.length && !missing && S.money > 0)) return L.zones[st.zone];
    if (!S.unl.nazmiye && S.cash > 0 && !S.carry.length) return L.cash;
    return earnTarget();
  }
  if (st.rate) return earnTarget();
  if (S.chapter === 1) switch (S.step) {
    case 0: return S.carry.length >= capNow() ? L.sat : fishTarget();
    case 1: return S.carry.length ? L.sat : fishTarget();
    case 2: return S.carry.length || T.customers.length ? L.sat : fishTarget();
    case 3: return S.cash > 0 ? L.cash : (S.carry.length ? L.sat : fishTarget());
    case 5: return obtainTarget("temiz");
    case 6: return sellTarget("temiz");
    case 10: return sellTarget("tuzlu");
    case 14: return sellTarget("tutsu");
  }
  if (S.chapter === 2) {
    if (S.step === 1) return S.carry.length >= capNow() ? fullTarget() : obtainTarget("yascay");
    if (S.step === 3) return sellTarget("kurucay");
  }
  if (S.chapter === 3 && (S.step === 2 || S.step === 9)) return S.ct ? earnTarget() : L.rampaAt;
  if (S.chapter === 4) {
    if (S.step === 2) return S.carry.length >= capNow() ? fullTarget() : obtainTarget("sut");
    if (S.step === 4) return sellTarget("peynir");
  }

}

function callList() {

  if (S.ct && S.ct.t < 40 && far(L.rampaAt)) out.push([L.rampaAt, "Kamyon gidiyor"]);

const ctx = cv.getContext("2d");

addEventListener("resize", resize);

function poly(pts, fill, stroke, lw = 1) {

function shade(hex, f) {

}
function box(x, y, w, d, h1, top, left, right, h0 = 0, stroke = "rgba(30,25,20,.32)") {

function faceY(x0, yFace, u0, u1, v0, v1, fill) { poly([P(x0 + u0, yFace, v0), P(x0 + u1, yFace, v0), P(x0 + u1, yFace, v1), P(x0 + u0, yFace, v1)], fill, "rgba(0,0,0,.25)"); }
function faceX(xFace, y0, u0, u1, v0, v1, fill) { poly([P(xFace, y0 + u0, v0), P(xFace, y0 + u1, v0), P(xFace, y0 + u1, v1), P(xFace, y0 + u0, v1)], fill, "rgba(0,0,0,.25)"); }

function shadow(x, y, rx, ry) { const [a, b] = P(x, y); ellipse(a, b, rx, ry, "rgba(15,30,20,.25)"); }

/* ---- zemin ---- */
const HILL_H = x => 10 + (-1 - x) * 13;
function tileKind(x, y) {
  if (x < 0 && y >= -1) return "hill";
  if (y < 0 && y >= -2 && x >= 11 && x <= 15) return "shallow";
  if (y < 0) return "sea";
  if (y === 0) return "pebble";
  if (ROAD.includes(y)) return S.chapter >= 3 ? "asphalt" : "road";
  if (x >= mapW() || y >= mapH()) return "wild";
  for (const [k, r] of Object.entries(L.plots)) if (x >= r.x - .3 && x < r.x + r.w - .3 && y >= r.y - .4 && y < r.y + r.h - .4) return S.unl[k] ? "terrace" : "weeds";

  if (y === 1 && x >= 3 && x < 16) return "pebble2";

function drawGround() {
  const t = T.time;
  for (let s = -20; s < 64; s++) {
    for (let x = -9; x < 30; x++) {
      const y = s - x;
      if (y < -11 || y > 34) continue;
      const k = tileKind(x, y), r = hash(x, y);
      const hh = k === "hill" ? HILL_H(Math.max(x, -7)) : 0;
      const [sx, sy] = P(x + .5, y + .5, hh);
      const scrX = (sx - cam.x) * Z + W / 2, scrY = (sy - cam.y) * Z + H * .46;
      if (scrX < -90 || scrX > W + 90 || scrY < -80 || scrY > H + 140) continue;
      if (k === "sea") {
        const wave = Math.sin(t * 1.3 + x * .7 + y * 1.1) * .035;
        tile(x, y, shade("#3d5d77", 0.96 + r * .06 + wave + Math.max(-.18, y * .018)), null);
        if (r > .72) { const [a, b] = P(x + .5, y + .5); const o = Math.sin(t + r * 9) * 3; line([a - 8 + o, b], [a + 6 + o, b], "rgba(225,235,240,.32)", 1.5); }
      } else if (k === "shallow") {

      } else if (k === "pebble" || k === "pebble2") {
        tile(x, y, shade(k === "pebble" ? "#a7a49a" : "#8f9a6e", .94 + r * .08), null);
        for (let i = 0; i < 4; i++) { const [a, b] = P(x + hash(x, y + i), y + hash(y + i, x)); ellipse(a, b, 2.4 + r * 1.5, 1.6, i % 2 ? "#c9c6bb" : "#7f7d75"); }
        if (k === "pebble") { const foam = Math.sin(t * 2 + x * .9) * .08; line(P(x, y + .02 + foam), P(x + 1, y + .02 + foam), "rgba(240,245,245,.55)", 2); }
      } else if (k === "road" || k === "asphalt") {

      } else if (k === "path") tile(x, y, shade("#b9a47c", .95 + r * .06), "rgba(90,70,40,.15)");

let LBL = [];
const MAX_LABELS = 7;
function lab(wx, wy, prio, f) { LBL.push({ wx, wy, prio, f, d: dist(S.px, S.py, wx, wy) }); }
function flushLabels() {
  const must = LBL.filter(l => l.prio >= 3);
  const rest = LBL.filter(l => l.prio < 3 && l.d < (l.prio === 2 ? 6 : 3.4)).sort((a, b) => (a.d - a.prio * 1.5) - (b.d - b.prio * 1.5));
  const show = must.concat(rest.slice(0, Math.max(0, MAX_LABELS - must.length)));

    const zid = st.zone, [zx, zy] = L.zones[zid], cost = CFG.zoneCost[zid], paid = S.paid[zid] || 0;
    const s = .74 + Math.sin(T.time * 4) * .03, on = near([zx, zy], .75);
    poly([P(zx - s, zy - s), P(zx + s, zy - s), P(zx + s, zy + s), P(zx - s, zy + s)], "rgba(20,40,60,.25)", null);
    poly([P(zx - s, zy - s, 3), P(zx + s, zy - s, 3), P(zx + s, zy + s, 3), P(zx - s, zy + s, 3)], on ? "rgba(36,66,94,.62)" : "rgba(36,66,94,.42)", "rgba(255,255,255,.98)", 4.5);
    const f = paid / cost;
    if (f > 0) poly([P(zx - s, zy + s - 2 * s * f, 3), P(zx + s, zy + s - 2 * s * f, 3), P(zx + s, zy + s, 3), P(zx - s, zy + s, 3)], "rgba(240,180,58,.85)", null);
    { const [ca, cb] = P(zx, zy, 6); drawItem("para", ca - 7, cb + 2, 1.4); drawItem("para", ca + 6, cb - 1, 1.4); drawItem("para", ca, cb - 5, 1.4); }
    const [a, b] = P(zx, zy, 18);
    const items = Object.entries(goodsNeed()).map(([k, n]) => [k, n, false]);
    lab(zx, zy, 4, () => {
      label(a, b - 14, ZONE_TITLES[zid], 12, "rgba(27,38,51,.86)");
      label(a, b + 6, (cost - paid).toLocaleString("tr-TR") + " ₺", 17, "#f0b43a", "#1b2633");
      if (items.length) itemRow(a, b + 30, "EL İŞİ", items, "rgba(150,100,10,.94)");
    });
  }
}

/* ---- yön okları ---- */
function drawTargetMarker(tp) {
  if (!tp) return;
  const [a, b] = P(tp[0], tp[1], 34 + Math.abs(Math.sin(T.time * 4)) * 8);
  poly([[a - 8, b - 10], [a + 8, b - 10], [a, b]], "#f0b43a", "rgba(80,50,0,.7)", 1.5);
  if (dist(S.px, S.py, tp[0], tp[1]) < 1.2) return;
  const [px, py] = P(S.px, S.py), [tx, ty] = P(tp[0], tp[1]);
  const ang = Math.atan2(ty - py, tx - px);
  ctx.save(); ctx.translate(px + Math.cos(ang) * 30, py + Math.sin(ang) * 27); ctx.rotate(ang);
  poly([[10, 0], [-6, -7], [-3, 0], [-6, 7]], "#f0b43a", "rgba(80,50,0,.6)", 1.5);
  ctx.restore();
}
function edgeArrow(p, text, col, idx) {
  const [sx, sy] = toScreen(p[0], p[1]);
  const top = 70, bot = H - 150, m = 34;
  if (sx > m && sx < W - m && sy > top && sy < bot) return;
  const cx = W / 2, cy = (top + bot) / 2, dx = sx - cx, dy = sy - cy;
  const k = Math.min((W / 2 - m) / Math.abs(dx || 1e-6), ((bot - top) / 2) / Math.abs(dy || 1e-6));
  const ex = cx + dx * k, ey = cy + dy * k + idx * 30, ang = Math.atan2(dy, dx);
  ctx.save(); ctx.translate(ex, ey); ctx.rotate(ang);
  const pulse = 1 + Math.sin(T.time * 6) * .08; ctx.scale(pulse, pulse);
  poly([[14, 0], [-8, -11], [-3, 0], [-8, 11]], col, "rgba(60,40,0,.75)", 2);
  ctx.restore();
  if (text) label(Math.max(80, Math.min(W - 80, ex - Math.cos(ang) * 34)), Math.max(top + 4, Math.min(bot - 4, ey - Math.sin(ang) * 26)), text, 11, col === "#f0b43a" ? "rgba(27,38,51,.82)" : col);
}
function targetName(tp) {
  const m = [[L.fishSpot, "SIĞLIK"], [L.sat, S.unl.market ? "MARKET" : "SAT"], [L.cash, "PARA"], [L.pile, "HAMSİ AL"], [L.paketOut, "KOLİ AL"], [L.paketIn, "EL PAKETİ"], [L.rampaAt, "RAMPA"]];
  for (const id in FAC) m.push([FAC[id].inAt, SHORT[FAC[id].inK]], [FAC[id].outAt, SHORT[FAC[id].outK] + " AL"]);
  for (const [p, n] of m) if (p === tp) return n;
  const st = STEP(); if (st.zone && tp === L.zones[st.zone]) return ZONE_TITLES[st.zone];
  const c = S.crops.find(c => c.x === tp[0] && c.y === tp[1]); if (c) return { yascay: "ÇAY TOPLA", findik: "FINDIK TOPLA", hamsi: "HAMSİ TOPLA" }[c.k];
  return null;
}
function drawJoy() {
  if (!joy.on) return;
  const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy), m = Math.min(1, 46 / (d || 1));
  ctx.globalAlpha = .35; ellipse(joy.ox, joy.oy, 46, 46, "#f3f1ea");
  ctx.globalAlpha = .7; ellipse(joy.ox + dx * m, joy.oy + dy * m, 18, 18, "#f3f1ea");
  ctx.globalAlpha = 1;
}

const WORKER_EXTRA = { nazmiye: { apron: "#f4f1ea" }, fadime: { apron: "#f4f1ea" }, kazim: { apron: "#e9e4d8" } };
const DRAW_FAC = { ayik: drawAyik, tuz: drawTuz, tutsu: drawTutsu, fabrika: drawFabrika, kavurma: drawKavurma, mandira: drawMandira, suzme: drawSuzme };
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#4d7438"; ctx.fillRect(0, 0, cv.width, cv.height);
  T.zoom += ((S.chapter >= 4 ? .78 : S.chapter >= 3 ? .82 : 1) - T.zoom) * .03;   // kasabada kamera geri çekilir
  Z = Z0 * T.zoom;
  const [px, py] = P(S.px, S.py);
  cam.x += (px - cam.x) * .12; cam.y += (py - 20 - cam.y) * .12;
  ctx.setTransform(DPR * Z, 0, 0, DPR * Z, DPR * (W / 2 - cam.x * Z), DPR * (H * .46 - cam.y * Z));
  drawGround();
  LBL = [];
  drawIskele();
  if (S.chapter >= 3) drawRampa();
  const tp = targetPoint();
  drawPads(tp);

  const list = [];
  const add = (d, f) => list.push({ d, f });
  const mid = r => r.x + r.w / 2 + r.y + r.h / 2;
  add(L.dock[0] + L.dock[1], drawBoat);
  for (const id in FAC) if (FAC[id].ch <= S.chapter) add(mid(FAC[id].r), popWrap(id, FAC[id].r, DRAW_FAC[id]));
  add(mid(L.stall), popWrap("market", L.stall, drawStall));
  add(mid(L.yali), popWrap("yali", L.yali, drawYali));
  if (!S.unl.market) add(mid(L.kufe), drawKufe);
  add(L.pile[0] + L.pile[1] - .6, drawPile);
  add(L.sign[0] + L.sign[1], drawSign);
  if (S.chapter >= 2) {
    for (const [k, r] of Object.entries(L.houses)) add(mid(r), popWrap(k, r, () => drawHouse(r, S.unl[k])));
    add(mid(L.ocak), popWrap("ocak", L.ocak, drawOcak));
  }
  if (S.chapter >= 3) { add(mid(L.paket), popWrap("paket", L.paket, drawPaket)); add(mid(L.festival), popWrap("festival", L.festival, drawFestival)); add(L.truck[0] + L.truck[1] + .5, drawTruck); }
  if (S.chapter >= 4) { add(mid(L.ahir), popWrap("ahir", L.ahir, drawAhir)); add(mid(L.yev), popWrap("yev", L.yev, drawYev)); add(mid(L.senlik), popWrap("senlik", L.senlik, drawSenlik)); }
  for (const c of S.crops) add(c.x + c.y, c.cow ? () => drawCow(c) : c.hive ? () => drawHive(c) : c.tree ? () => drawFindik(c.x, c.y, 0, 1.15, c.n) : c.fish ? () => drawShoalFish(c) : () => drawTea(c));
  for (const [x, y] of [[-3.6, 2.2], [-5.4, 7.6], [-2.8, 11.6]]) add(-100 + x + y, () => drawHillHouse(x, y, "#a26b3e", "#6f7b86"));
  for (const [x, y] of DECOR) add(x + y, () => drawFindik(x, y, 0, 1, 0));
  for (const c of T.customers) add(c.x + c.y, () => { drawPerson(c.x, c.y, Object.assign({}, c.look, { face: c.face, walk: c.walk, moving: c.moving })); if (c.state === "wait" || c.sad) lab(c.x, c.y, 1, () => bubble(c)); });
  for (const id in T.workers) if (S.unl[id]) {
    const w = T.workers[id];
    add(w.x + w.y, () => drawPerson(w.x, w.y, Object.assign({}, PEOPLE[id], WORKER_EXTRA[id] || {}, { face: w.face, walk: w.walk, moving: w.moving, carry: w.carry })));
  }
  add(S.px + S.py, () => {
    const [a, b] = P(S.px, S.py), q = T.bounce;
    ctx.save(); ctx.translate(a, b); ctx.scale(1 + q * .08, 1 - q * .12); ctx.translate(-a, -b);
    drawPerson(S.px, S.py, Object.assign({}, PEOPLE.sen, { face: T.face, walk: T.walk, moving: T.moving, carry: S.carry }));
    ctx.restore();
  });
  list.sort((a, b) => a.d - b.d);
  for (const it of list) it.f();
  drawFx();
  drawTargetMarker(tp);
  flushLabels();
  for (const f of T.floats) {
    const [a, b] = P(f.x, f.y, 60 + f.t * 30);
    ctx.globalAlpha = Math.max(0, 1 - f.t / 1.4);
    ctx.font = "800 15px 'Baloo 2', sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(20,30,40,.75)"; ctx.strokeText(f.text, a, b); ctx.fillStyle = f.color; ctx.fillText(f.text, a, b);
    ctx.globalAlpha = 1;
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (tp) edgeArrow(tp, targetName(tp), "#f0b43a", 0);
  callList().forEach(([p, txt], i) => edgeArrow(p, "Nazmiye: " + txt, "#c8352b", i + 1));
  drawJoy();
}
let DECOR = [];
function makeDecor() {
  DECOR = [];
  for (let i = 0; i < 170; i++) {
    const x = hash(i, 11) * 28, y = 0.5 + hash(13, i) * 33;
    if (x < 23.3 && y < 27.3) continue;             // oyun alanı ve ileride açılacak bölgeler
    if (y >= ROAD[0] - .3 && y <= ROAD[1] + 1.3) continue;
    DECOR.push([x, y]);
  }
  for (const p of [[0.9, 4.5], [1.0, 8.8], [15.3, 11.0]]) DECOR.push(p);
}

/* ================================================================
   ARAYÜZ
   ================================================================ */
let lastHud = "";
function hud() {
  const cap = capNow();
  $("basketFill").style.width = Math.min(100, S.carry.length / cap * 100) + "%";
  $("basketPill").classList.toggle("full", S.carry.length >= cap);
  T.shown += (S.money - T.shown) * .18; if (Math.abs(S.money - T.shown) < 1) T.shown = S.money;
  $("moneyTxt").textContent = Math.round(T.shown).toLocaleString("tr-TR");
  $("repTxt").textContent = Math.round(S.rep);
  $("popTxt").textContent = S.pop;
  let step, text, req = "", pct;
  const chap = "Bölüm " + S.chapter + " · " + CHAPTERS[S.chapter].title;
  if (S.done) {
    step = "★"; pct = 100;
    if (CHAPTERS[S.chapter + 1]) { text = "Bölüm " + (S.chapter + 1) + ": " + CHAPTERS[S.chapter + 1].title; req = "Başlamak için dokun"; }
    else { text = "Bölüm 5: Fırtına sezonu yakında"; req = "Yayla dönüyor; satmaya ve kamyon doldurmaya devam edebilirsin."; }
  } else {
    const st = STEP();
    step = S.step + 1; text = st.text;
    if (st.zone) {
      const cost = CFG.zoneCost[st.zone], paid = S.paid[st.zone] || 0;
      pct = paid / cost * 100;
      req = S.money + paid >= cost ? "Bedel " + cost.toLocaleString("tr-TR") + " ₺ · karede dur" : "Bedel " + cost.toLocaleString("tr-TR") + " ₺ · " + (cost - paid - S.money).toLocaleString("tr-TR") + " ₺ daha kazan";
    } else if (st.rate) {
      pct = Math.min(perMin(), st.rate) / st.rate * 100; req = "Şu an dakikada " + Math.round(perMin()).toLocaleString("tr-TR") + " ₺";
    } else { const v = Math.min(st.val(S), st.goal); pct = v / st.goal * 100; req = v + " / " + st.goal; }
  }
  $("goal").classList.toggle("cta", S.done && !!CHAPTERS[S.chapter + 1]);
  const key = chap + step + "|" + text + "|" + req + "|" + Math.round(pct);
  if (key !== lastHud) {
    lastHud = key;
    $("goalChap").textContent = chap;
    $("goalStep").textContent = step; $("goalText").textContent = text;
    $("goalReq").textContent = req; $("goalReq").hidden = !req;
    $("goalBar").style.width = pct + "%";
  }
}
function portraitSVG(id) {

  const head = p.scarf
    ? `<circle cx="32" cy="30" r="15" fill="${p.scarf}"/><ellipse cx="32" cy="32" rx="10" ry="11" fill="${p.skin}"/>`
    : `<ellipse cx="32" cy="31" rx="12" ry="13" fill="${p.skin}"/><path d="M19 26 Q32 10 45 26 Z" fill="${p.cap}"/><rect x="24" y="24" width="${id === "temel" ? 22 : 18}" height="3" rx="1.5" fill="${p.cap}"/>`;
  const mus = ["temel", "idris", "kazim", "cafer"].includes(id) ? `<path d="M26 38 q6 -3 12 0" stroke="#3a2a1e" stroke-width="2.4" fill="none"/>` : "";
  return `<svg class="portrait" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#cfdbe2"/><path d="M0 50 Q20 42 40 48 T64 46 V64 H0Z" fill="#9fb3c2"/><rect x="14" y="44" width="36" height="24" rx="10" fill="${p.body}"/>${head}${mus}<circle cx="28" cy="32" r="1.4" fill="#222"/><circle cx="36" cy="32" r="1.4" fill="#222"/></svg>`;
}
function showDialog(id, after) {
  if (!id || !DIALOGS[id] || S.seen[id]) { if (after) after(); return; }
  if (T.dialog) { const prev = T.dialog.after; T.dialog.after = () => { if (prev) prev(); showDialog(id, after); }; return; }
  T.dialog = { lines: DIALOGS[id], i: 0, id, after };
  joy.on = false;
  renderDialog();
}
function renderDialog() {
  const d = T.dialog, [who, text] = d.lines[d.i], p = PEOPLE[who];
  const last = d.i === d.lines.length - 1;
  $("sheet").innerHTML = p.letter
    ? `<div class="dlg letter"><div><div class="who">${p.name}<small>${p.role}</small></div><p>${text}</p></div></div><div class="hint">${last ? "Kapat" : "Devam"} ›</div>`
    : `<div class="dlg">${portraitSVG(who)}<div><div class="who">${p.name}<small>${p.role}</small></div><p>${text}</p></div></div><div class="hint">${last ? "Tamam" : "Devam"} ›</div>`;
  $("sheetWrap").hidden = false;
}
function advanceDialog() {
  const d = T.dialog; if (!d) return;

    S.seen[d.id] = true; T.dialog = null; $("sheetWrap").hidden = true; save();
    if (d.after) d.after();

}
$("sheetWrap").addEventListener("click", e => {
  if (T.dialog) { advanceDialog(); return; }
  if (e.target === $("sheetWrap")) closeSheet();
});
addEventListener("keydown", e => {
  if (typing(e)) return;
  if (T.dialog && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); advanceDialog(); return; }
  if (e.key === "Escape" && !T.dialog) { if ($("sheetWrap").hidden) openMenu(); else closeSheet(); }
});
$("menuBtn").addEventListener("click", openMenu);
$("goal").addEventListener("click", () => { if (S.done && CHAPTERS[S.chapter + 1]) startChapter(S.chapter + 1); });
function closeSheet() { $("sheetWrap").hidden = true; }
function ensureShoal(s) {
  if (!s.crops.some(c => c.fish)) s.crops.push(...shoalCrops());
  for (const k of PRODUCTS) { if (s.shelf[k] === undefined) s.shelf[k] = 0; if (s.shelfH[k] === undefined) s.shelfH[k] = 0; }
  for (const id in FAC) if (!s.fac[id]) s.fac[id] = { inp: 0, hand: 0, out: 0, outH: 0, t: 0 };
  return s;
}
function adoptState(s) {
  S = ensureShoal(s); T.workers = {}; T.customers = []; T.shown = S.money; T.boat = { phase: "dock", t: 0 }; T.rev.fill(0);
  makeDecor(); unstick(); const [px, py] = P(S.px, S.py); cam.x = px; cam.y = py - 20; save();
}
function openMenu() {
  if (T.dialog) return;
  joy.on = false;
  $("sheet").innerHTML = `<h2>Faroz</h2>
    <p class="note">Ekranda bir yere bas, parmağını kaydır: yürürsün. Klavyede WASD ya da oklar. Bir karenin üstünde durman yeter. Kendi elinle tesise koyduğundan çıkan mal mühürlüdür (★) ve daha pahalı gider.</p>
    <div class="menu-list"><button class="btn" id="mResume">Devam et</button><button class="btn light" id="mSound">${muted ? "Sesi aç" : "Sesi kapat"}</button><button class="btn light" id="mCode">Kayıt kodu</button><button class="btn red" id="mReset">Baştan başla</button></div>`;
  $("sheetWrap").hidden = false;
  $("mResume").onclick = closeSheet;
  $("mCode").onclick = openCode;
  $("mSound").onclick = () => { muted = !muted; try { localStorage.setItem("faroz.mute", muted ? "1" : "0"); } catch (e) {} if (!muted) audioOn(); openMenu(); };
  $("mReset").onclick = e => {
    const b = e.currentTarget;
    if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Emin misin? Bir daha dokun"; return; }

function openCode() {
  $("sheet").innerHTML = `<h2>Kayıt kodu</h2>
    <p class="note">Bu kodu sakla; başka bir cihazda aşağıya yapıştırıp yükleyebilirsin.</p>
    <textarea id="codeOut" readonly></textarea>
    <div class="menu-list"><button class="btn light" id="cCopy">Kodu kopyala</button></div>
    <textarea id="codeIn" placeholder="Kayıt kodunu buraya yapıştır"></textarea>
    <div class="menu-list"><button class="btn" id="cLoad">Kodu yükle</button><button class="btn light" id="cBack">Geri</button></div>
    <p class="note" id="cMsg"></p>`;
  $("codeOut").value = saveCode();
  $("cCopy").onclick = () => { const t = $("codeOut"); t.select(); try { navigator.clipboard.writeText(t.value).then(() => { $("cMsg").textContent = "Kopyalandı."; }, () => { $("cMsg").textContent = "Kod seçildi, kopyalayabilirsin."; }); } catch (e) { $("cMsg").textContent = "Kod seçildi, kopyalayabilirsin."; } };
  $("cLoad").onclick = () => { const s = readCode($("codeIn").value); if (!s) { $("cMsg").textContent = "Kod okunamadı. Kodun tamamını yapıştırdığından emin ol."; return; } adoptState(s); closeSheet(); toast("Kayıt yüklendi."); };
  $("cBack").onclick = openMenu;
}
function showEnd(ch) {
  save();
  const sold = S.st.sold, next = CHAPTERS[ch + 1];

  const sub = { 1: "İskele işliyor, tütsühane tütüyor, yalının bacası duman salıyor. Hamsi işi artık kendi döner.", 2: "Çay yamacı yeşerdi, köy kalabalıklaştı, çay ocağında Trabzon'un toptancıları konuşuluyor.", 3: "Faroz kasaba oldu. Kamyonlar koli koli tütsülü, çay ve fındık taşıyor. Festival meydanı dolu.", 4: "Yayla şenliğinde horon tepildi, dayının sırrı açıldı. Temel'in elinde eski bir anahtar var. Sırada fırtına sezonu." }[ch];
  $("sheet").innerHTML = `<div class="eyebrow">Bölüm ${ch} tamam</div>
    <h2>${CHAPTERS[ch].title}</h2><p>${sub}</p>
    <div class="stats">${rows}<span>Sözleşme</span><b>${S.st.contracts}</b><span>Toplam kazanç</span><b>${S.st.earned.toLocaleString("tr-TR")} ₺</b></div>
    <div class="menu-list">${next ? `<button class="btn" id="eNext">Bölüm ${ch + 1}: ${next.title}</button>` : ""}<button class="btn light" id="eStay">Burada biraz daha kal</button></div>`;
  $("sheetWrap").hidden = false;
  if (next) $("eNext").onclick = () => startChapter(ch + 1);
  $("eStay").onclick = closeSheet;
}
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

/* ================================================================
   BAŞLAT
   ================================================================ */
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  update(dt); render(); hud();
  requestAnimationFrame(frame);
}
function start(data) {
  const old = hadOldSave();
  S = ensureShoal((data && data.S && data.S.v === 2) ? data.S : (load() || newState()));
  resize(); makeDecor(); unstick(); T.shown = S.money;
  const [px, py] = P(S.px, S.py); cam.x = px; cam.y = py - 20;
  T.zoom = S.chapter >= 4 ? .78 : S.chapter >= 3 ? .82 : 1;
  if (old && !S.seen.intro) toast("Oyun yenilendi, baştan başlıyorsun.", 4);
  if (!S.seen.intro) showDialog("intro");
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.__faroz = { get S() { return S; }, set S(v) { S = v; }, T, CFG, L, FAC, CHAPTERS, update, advanceDialog, targetPoint, blocked, startChapter, perMin, callList, newState, adoptState, saveCode, readCode, VILLAGE_VOICES, koliValue, price };
const boot = () => window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
if (document.fonts && document.fonts.load) Promise.race([document.fonts.load("800 16px 'Baloo 2'"), new Promise(r => setTimeout(r, 800))]).then(boot, boot);
else boot();
</script>
